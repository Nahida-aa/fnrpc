[package]
name = "benches"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["fnrpc-variants"]
fnrpc-variants = []
xitca-web-plain = []
axum-plain = []
actix-web = ["dep:actix-web", "dep:actix-rt"]
ntex = ["dep:ntex"]
full = ["fnrpc-variants", "xitca-web-plain", "axum-plain", "actix-web", "ntex"]
dhat-heap = ["dep:dhat"]
# Empty marker feature. The legacy `[[bin]]` server/dhat harnesses in this
# crate were written against old fnrpc APIs (`RouterBuilder::query/raw`,
# `fnrpc_web::run`, `enable_io_uring`, …) and no longer compile. They are
# gated behind this feature so they don't block `cargo bench` for the live
# criterion suites. Enable explicitly only if you intend to revive them.
legacy-bins = []

[dependencies]
# fnrpc variants (always available via path)
fnrpc = { path = "../crates/fnrpc" }
fnrpc-web = { path = "../crates/fnrpc-web", features = ["file"] }
fnrpc-xitca = { path = "../crates/fnrpc-xitca" }
fnrpc-axum = { path = "../crates/fnrpc-axum" }

# Framework deps for fnrpc variants (already transitive)
xitca-web = { version = "0.8", features = ["json", "params", "urlencoded", "codegen", "file"] }
xitca-http = { version = "0.9", features = ["http1"] }
xitca-server = { version = "0.7" }
xitca-service = "0.3"
xitca-unsafe-collection = "0.2"
axum = "0.8"
tower = "0.5"

# Router primitives for the routing-paradigm benchmark (same versions fnrpc uses)
# (removed — the paradigm benchmark is framework-free; see benches/routing_paradigm.rs)

# Bench harness
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }
dhat = { version = "0.3", optional = true }
serde_json = "1"
serde = "1"
async-trait = { workspace = true }
http = "1"
http-body-util = "0.1"
bytes = "1"
url = "2"
futures = "0.3"
specta = { workspace = true, features = ["derive"] }

# Optional: extra plain frameworks
actix-web = { version = "4", optional = true, features = ["experimental-io-uring"] }
actix-rt = { version = "2", optional = true }
ntex = { version = "3.10", optional = true, features = ["tokio"] }

# reqwest for network-level latency benchmarks
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "routing_paradigm"
harness = false

[[bench]]
name = "server_latency"
harness = false
required-features = ["reqwest"]

[[bin]]
name = "dhat_dispatch"
path = "src/bin/dhat_dispatch.rs"
required-features = ["legacy-bins"]

[[bin]]
name = "dhat_server"
path = "src/bin/dhat_server.rs"
required-features = ["legacy-bins"]

[[bin]]
name = "fnrpc_web_server"
path = "src/bin/fnrpc_web_server.rs"
required-features = ["legacy-bins"]

[[bin]]
name = "dhat_analyze"
path = "src/bin/dhat_analyze.rs"
required-features = ["legacy-bins"]

[[bin]]
name = "dhat_compare"
path = "src/bin/dhat_compare.rs"
required-features = ["legacy-bins"]

[[bin]]
name = "latency"
path = "src/bin/latency.rs"
required-features = ["legacy-bins", "reqwest"]

[[bin]]
name = "dhat_lookup"
path = "src/bin/dhat_lookup.rs"
required-features = ["legacy-bins"]

[[bin]]
name = "dhat_callpath_text"
path = "src/bin/dhat_callpath_text.rs"
required-features = ["legacy-bins"]

[[bin]]
name = "dhat_callpath_dispatch"
path = "src/bin/dhat_callpath_dispatch.rs"
required-features = ["legacy-bins"]

[[bin]]
name = "xitca_web_server"
path = "src/bin/xitca_web_server.rs"
required-features = ["legacy-bins"]

[[bin]]
name = "actix_web_server"
path = "src/bin/actix_web_server.rs"
required-features = ["legacy-bins", "actix-web"]

[[bin]]
name = "axum_web_server"
path = "src/bin/axum_web_server.rs"
required-features = ["legacy-bins"]

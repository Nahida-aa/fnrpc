name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust tests
        run: cargo test

      - name: Install TS deps
        run: bun install

      - name: Build TS packages
        run: bun run build

      - name: Typecheck TS packages
        run: bun run typecheck

      - name: Test TS packages
        run: bun run test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write npmrc for publishing
        # `bun publish` reads `.npmrc` for the registry token. The NPM_TOKEN
        # secret must be an npm token with publish rights and 2FA-TO-PUBLISH
        # disabled (granular token -> "Require 2FA to publish" OFF), so bun can
        # publish without prompting for an OTP in this headless environment.
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - uses: changesets/action@v1
        id: changesets
        with:
          # `version` bumps each TS package's version and commits the bump.
          version: bun x changeset version
          # Publish via the script: it rebuilds `bun.lock`, runs `bun run build`
          # (REQUIRED — the published artifact is the compiled `dist/`), then
          # `bun publish` (which understands the `workspace:*` protocol and
          # rewrites it to the real version, unlike `changeset publish`).
          publish: ./scripts/publish-ts.sh
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync Rust version and publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-rust.sh
